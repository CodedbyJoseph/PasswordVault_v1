<!DOCTYPE html>
<!-- to run front end, run this html file -->
<!-- file purpose: structure -->

<html lang="en">

<!-- setup -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Vault v1</title>

    <!-- include this line to run css -->
    <link rel="stylesheet" href="style.css">
</head>

<!-- visible content -->
<body>
    <h1>Password Vault v1</h1>
    <h2>Saved Accounts</h2>

    <!-- render saved accounts from js (stored in array) -->
    <div id="saved-accounts"></div>

    <!-- show new account form button -->
    <button id="show-form-btn">Add new password</button>

    <!-- new account form, set to hidden -->
    <div id="add-account-form" class="hidden">
        <input id="website-input" type="text" placeholder="Website">
        <input id="email-input" type="email" placeholder="Email">
        <input id="password-input" type="text" placeholder="Password">
        <button id="save-new-account">Save</button>
    </div>


<!-- to do:
- validation for new entries
    - js for logic
    - create an error message with class hidden on start
    - on event of successful entry, rehide the error message
- during stage 2, use database instead of js array and save entries to database instead -->


    <!-- error message, set to hidden -->
    <div id="err-msg" class="hidden">
        <h4>Error</h4>
    </div>

    <!-- include this line to run js-->
    <script src="script.js"></script>
</body>

</html>
