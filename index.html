<!DOCTYPE html>
<!-- to run front end, run this html file -->
<!-- file purpose: structure -->

<html lang="en">

<!-- setup -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Vault v1</title>

    <!-- fetch nunito font from google server -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200..1000&display=swap" rel="stylesheet">

    <!-- include this line to run css -->
    <link rel="stylesheet" href="style.css">
</head>

<!-- visible content -->
<body>
    <div class="right-align">
        <button id="log-in-btn">Log in</button>
        <button id="sign-up-btn">Sign up</button>
    </div>
    <h1>Password Vault v1</h1>

    <!-- split page into left and right half -->
    <div class="page-container">

        <!-- left -->
        <div class="left-panel">
            <h2>Saved Accounts</h2>
            <!-- render saved accounts from js (stored in array) -->
            <div id="saved-accounts"></div>
        </div>

        <!-- right -->
        <div class="right-panel">
            <h2>Actions</h2>
            <!-- show new account form button -->
            <button id="show-form-btn">Add new password</button>

            <!-- new account form, set to hidden -->
            <div id="add-account-form" class="hidden">
                <input id="website-input" type="text" placeholder="Website">
                <input id="email-input" type="email" placeholder="Email">
                <input id="password-input" type="text" placeholder="Password">
                <button id="save-new-account-btn">Save</button>
            </div>

            <!-- error message, set to hidden -->
            <div id="err-msg" class="hidden">
                <h4>Error</h4>
            </div>
        </div>

    </div>
    

    <!-- to do:
     - remove accounts option
     - add functionality to log in buttons
- during stage 2, use database instead of js array and save entries to database instead -->

    <!-- include this line to run js-->
    <script src="script.js"></script>
</body>

</html>
